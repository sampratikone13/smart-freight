{% extends "base.html" %}

{% block title %}Sign In{% endblock %}
{% block page_title %}Account Authentication{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 14px; width: 48px; height: 48px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h3 style="font-size: 1.25rem; font-weight: 700;">Welcome Back</h3>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Sign in to access logistics predictions and academic labs</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" required placeholder="e.g. analyst_demo">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--cyan-light); font-weight: 600; text-decoration: none;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
